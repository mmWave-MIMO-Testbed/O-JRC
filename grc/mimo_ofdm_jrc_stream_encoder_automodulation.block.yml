id: mimo_ofdm_jrc_stream_encoder_automodulation
label: stream_encoder_automodulation
category: '[mimo_ofdm_jrc]'

templates:
  imports: import mimo_ofdm_jrc
  make: mimo_ofdm_jrc.stream_encoder_automodulation(${mod_encode}, ${data_len}, ${N_ss_radar}, ${mcs_ctrl_file}, ${target_nsym}, ${debug})
  callbacks:
  - set_mcs(${mod_encode})

parameters:
- id: mod_encode
  label: MCS
  dtype: int
  default: mimo_ofdm_jrc.BPSK_1_2
  options: [BPSK_1_2, mimo_ofdm_jrc.BPSK_3_4, mimo_ofdm_jrc.QPSK_1_2, mimo_ofdm_jrc.QPSK_3_4,
      mimo_ofdm_jrc.QAM16_1_2, mimo_ofdm_jrc.QAM16_3_4]
  option_labels: [BPSK 1/2, BPSK 3/4, QPSK 1/2, QPSK 3/4, 16QAM 1/2, 16QAM 3/4]
- id: data_len
  label: Number of Data Subcarriers
  dtype: int
- id: N_ss_radar
  label: Number of Radar Streams
  dtype: int
- id: mcs_ctrl_file
  label: MCS Control File
  dtype: string
- id: target_nsym
  label: Target OFDM symbols
  dtype: int
  default: 48
- id: debug
  label: Debug
  dtype: bool
  default: 'False'
  options: ['True', 'False']
  option_labels: [Enable, Disable]

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
-   domain: message
    id: pdu_in

outputs:
-   domain: stream
    dtype: complex
    multiplicity: '1'
asserts:
- ${ mod_encode in range(9) }

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
